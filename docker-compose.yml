services:
  api:
    build:
      context: ./api
    container_name: chamados-api
    restart: unless-stopped
    environment:
      # SQLite dentro do volume — o arquivo precisa ficar fora da imagem
      DATABASE_URL: file:/data/chamados.db
      JWT_SECRET: ${JWT_SECRET}
      # Origens aceitas pelo CORS. A API se recusa a subir em produção sem ela.
      WEB_ORIGIN: ${WEB_ORIGIN}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PORT: 3002
    volumes:
      - chamados_db:/data
      - chamados_uploads:/app/uploads
    mem_limit: 384m
    networks:
      - internal
    # Sem "ports": a API só é alcançável pelo nginx do front, na rede interna.

  # Cópia diária do banco e das fotos. Sem isto, perder o volume é perder a operação.
  # O destino (BACKUP_DIR no host) deve ficar FORA deste servidor sempre que possível —
  # um disco externo ou um compartilhamento do NAS montado no host.
  backup:
    build:
      context: ./api
    container_name: chamados-backup
    restart: unless-stopped
    command: ['npm', 'run', 'backup:loop']
    environment:
      DATABASE_URL: file:/data/chamados.db
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /backup
      BACKUP_MANTER: ${BACKUP_MANTER:-14}
      BACKUP_INTERVALO: ${BACKUP_INTERVALO:-24}
      BACKUP_WEBHOOK: ${BACKUP_WEBHOOK:-}
    volumes:
      # O banco monta como leitura-e-escrita de propósito: o SQLite em modo WAL precisa
      # tocar os arquivos -wal/-shm até para ler. O backup só lê o conteúdo.
      - chamados_db:/data
      - chamados_uploads:/app/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backup
    mem_limit: 192m
    networks:
      - internal

  web:
    build: .
    container_name: chamados-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${APP_PORT:-3021}:80'
    mem_limit: 128m
    networks:
      - internal
      - proxy

volumes:
  chamados_db:
  chamados_uploads:

networks:
  internal:
  proxy:
    # Rede compartilhada entre as stacks (criada pela stack infra-proxy).
    # Se ainda não existe no servidor, crie uma única vez:
    #   docker network create proxy
    external: true
