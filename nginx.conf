server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # CSP do painel. Sem script/fonte externa — se algum dia entrar, precisa entrar aqui.
    # `img-src` libera os tiles do OpenStreetMap: o mapa dos locais é feito de imagens
    # vindas de tile.openstreetmap.org, e sem esta linha ele fica um retângulo azul —
    # em desenvolvimento funcionava, porque lá não passa por este nginx.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Geolocalização liberada para o próprio painel: é o "Centralizar em mim" do mapa.
    # Quem decide continua sendo o navegador, que pergunta antes para a pessoa.
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # `strict-origin-when-cross-origin` em vez de `no-referrer`: só o domínio do painel
    # (sem caminho, sem query) sai para fora. É o que a política de uso dos tiles do
    # OpenStreetMap pede para identificar quem está pedindo os mapas.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(env|git) {
        deny all;
        return 404;
    }
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # Foto de chamado sobe em base64 dentro do JSON — o padrão de 1 MB do nginx barraria.
    client_max_body_size 25m;

    # O front chama /api na mesma origem. A barra final troca /api/ por / (a API
    # registra as rotas na raiz).
    location /api/ {
        proxy_pass http://api:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # O service worker precisa ser sempre revalidado, senão a versão nova demora a chegar.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA: rota desconhecida devolve o index e o React Router resolve
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
